<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#fff;font-family:Arial,Helvetica,sans-serif}
svg text{font-family:Arial,Helvetica,sans-serif}
</style></head><body>
<svg width="900" height="560" viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F3864"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#375623"/></marker>
<marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7F6000"/></marker>
</defs>
<!-- flujo principal -->
<g font-size="14">
<rect x="20" y="30" width="150" height="70" rx="10" fill="#1F3864"/>
<text x="95" y="60" text-anchor="middle" fill="#fff" font-weight="bold" font-size="16">Inicio</text>
<text x="95" y="80" text-anchor="middle" fill="#fff" font-size="12">presentación de la guía</text>

<rect x="210" y="20" width="200" height="90" rx="10" fill="#fff" stroke="#1F3864" stroke-width="2"/>
<text x="310" y="46" text-anchor="middle" font-weight="bold" font-size="16" fill="#1F3864">M0. Punto de partida</text>
<text x="310" y="66" text-anchor="middle" font-size="12">autoevaluación de entrada</text>
<text x="310" y="82" text-anchor="middle" font-size="12">recomendación y elección de ruta</text>
<text x="310" y="98" text-anchor="middle" font-size="12">aceptación de reglas de uso ético</text>

<rect x="450" y="30" width="170" height="70" rx="10" fill="#1F3864"/>
<text x="535" y="60" text-anchor="middle" fill="#fff" font-weight="bold" font-size="16">Mapa de la guía</text>
<text x="535" y="80" text-anchor="middle" fill="#fff" font-size="12">módulos por eje y por ruta</text>

<rect x="660" y="20" width="220" height="210" rx="10" fill="#fff" stroke="#1F3864" stroke-width="2"/>
<text x="770" y="46" text-anchor="middle" font-weight="bold" font-size="16" fill="#1F3864">Módulo (M1 a M8, reto)</text>
<rect x="676" y="58" width="188" height="30" rx="6" fill="#DCE6F2"/><text x="770" y="78" text-anchor="middle" font-size="12">núcleo común</text>
<rect x="676" y="94" width="92" height="36" rx="6" fill="#E2EFDA"/><text x="722" y="110" text-anchor="middle" font-size="11">recuadros de</text><text x="722" y="124" text-anchor="middle" font-size="11">ruta básica</text>
<rect x="772" y="94" width="92" height="36" rx="6" fill="#DCE6F2" stroke="#1F3864" stroke-width="1"/><text x="818" y="110" text-anchor="middle" font-size="11">recuadros de</text><text x="818" y="124" text-anchor="middle" font-size="11">ruta avanzada</text>
<rect x="676" y="136" width="188" height="30" rx="6" fill="#FFF2CC"/><text x="770" y="156" text-anchor="middle" font-size="12">laboratorios (tras aceptar reglas)</text>
<rect x="676" y="172" width="188" height="44" rx="6" fill="#E2EFDA" stroke="#375623"/><text x="770" y="190" text-anchor="middle" font-size="12">autoevaluación con</text><text x="770" y="206" text-anchor="middle" font-size="12">retroalimentación</text>
</g>
<line x1="170" y1="65" x2="206" y2="65" stroke="#1F3864" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="410" y1="65" x2="446" y2="65" stroke="#1F3864" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="620" y1="65" x2="656" y2="65" stroke="#1F3864" stroke-width="2.5" marker-end="url(#a)"/>

<!-- insignias -->
<rect x="660" y="280" width="220" height="60" rx="10" fill="#375623"/>
<text x="770" y="307" text-anchor="middle" fill="#fff" font-weight="bold" font-size="16">Mis insignias</text>
<text x="770" y="326" text-anchor="middle" fill="#fff" font-size="12">se obtienen con 70 % o más</text>
<line x1="770" y1="230" x2="770" y2="276" stroke="#375623" stroke-width="2.5" marker-end="url(#g)"/>
<path d="M 660 125 L 640 125 L 640 100 L 620 100" stroke="#1F3864" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="600" y="140" text-anchor="end" font-size="11" fill="#1F3864">regresar al mapa</text>

<!-- almacenamiento -->
<rect x="210" y="160" width="400" height="80" rx="10" fill="#F2F2F2" stroke="#8a8a85" stroke-dasharray="6 4"/>
<text x="410" y="188" text-anchor="middle" font-weight="bold" font-size="15" fill="#333">Almacenamiento local del navegador</text>
<text x="410" y="208" text-anchor="middle" font-size="12" fill="#333">ruta elegida, aceptación de reglas, resultados e insignias</text>
<text x="410" y="226" text-anchor="middle" font-size="12" fill="#333">no hay registro ni servidor; ningún dato sale del equipo</text>
<line x1="310" y1="110" x2="310" y2="156" stroke="#8a8a85" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#a)"/>
<line x1="656" y1="200" x2="614" y2="200" stroke="#8a8a85" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#a)"/>

<!-- asistente -->
<rect x="20" y="300" width="580" height="240" rx="12" fill="#FFF8E5" stroke="#7F6000" stroke-width="2"/>
<text x="310" y="328" text-anchor="middle" font-weight="bold" font-size="16" fill="#7F6000">Asistente conversacional (disponible en cada módulo)</text>
<text x="310" y="348" text-anchor="middle" font-size="12">recibe la pregunta y el texto del módulo abierto; no guarda las conversaciones</text>
<rect x="40" y="366" width="170" height="80" rx="8" fill="#fff" stroke="#7F6000"/>
<text x="125" y="390" text-anchor="middle" font-weight="bold" font-size="13">Ollama local</text>
<text x="125" y="408" text-anchor="middle" font-size="11">en el equipo o en el</text><text x="125" y="422" text-anchor="middle" font-size="11">servidor del laboratorio</text><text x="125" y="438" text-anchor="middle" font-size="11">(uso con estudiantes)</text>
<rect x="225" y="366" width="170" height="80" rx="8" fill="#fff" stroke="#7F6000"/>
<text x="310" y="390" text-anchor="middle" font-weight="bold" font-size="13">Gemini</text>
<text x="310" y="408" text-anchor="middle" font-size="11">mediante intermediario</text><text x="310" y="422" text-anchor="middle" font-size="11">que protege la clave</text><text x="310" y="438" text-anchor="middle" font-size="11">(prototipo con adultos)</text>
<rect x="410" y="366" width="170" height="80" rx="8" fill="#fff" stroke="#7F6000"/>
<text x="495" y="390" text-anchor="middle" font-weight="bold" font-size="13">Sin conexión</text>
<text x="495" y="408" text-anchor="middle" font-size="11">responde con las</text><text x="495" y="422" text-anchor="middle" font-size="11">preguntas frecuentes</text><text x="495" y="438" text-anchor="middle" font-size="11">del módulo</text>
<text x="310" y="478" text-anchor="middle" font-size="12">detección automática, primero Ollama, después Gemini y, si no hay modelo, preguntas frecuentes</text>
<rect x="160" y="494" width="300" height="32" rx="8" fill="#fff" stroke="#7F6000" stroke-dasharray="5 4"/>
<text x="310" y="515" text-anchor="middle" font-size="12">páginas Configuración del asistente y Ayuda</text>
<path d="M 660 190 L 630 190 L 630 300 L 600 300" stroke="#7F6000" stroke-width="1.8" fill="none" marker-end="url(#m)"/>
<text x="636" y="268" font-size="11" fill="#7F6000">pregunta</text>
</svg></body></html>
