<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#fff;font-family:Arial,Helvetica,sans-serif}
svg text{font-family:Arial,Helvetica,sans-serif;fill:#222}
</style></head><body>
<svg id="c" width="900" height="500" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const years=['2022','2023','2024','2025','2026'];
const series=[
 {name:'Defensa',color:'#2a78d6',v:[2,10,10,32,44]},
 {name:'Ofensiva',color:'#eb6834',v:[1,1,5,22,39]},
 {name:'Educación',color:'#1baf7a',v:[0,2,6,13,17]},
 {name:'Seguridad de los agentes',color:'#eda100',v:[0,0,1,5,17]},
 {name:'General',color:'#e87ba4',v:[0,1,1,10,11]},
];
const svg=document.getElementById('c'),NS='http://www.w3.org/2000/svg';
const el=(t,a,txt)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;svg.appendChild(e);return e};
const L=80,R=880,T=90,B=440,max=140,step=20;
const y=v=>B-(v/max)*(B-T);
for(let v=0;v<=max;v+=step){el('line',{x1:L,x2:R,y1:y(v),y2:y(v),stroke:v?'#e4e4e0':'#8a8a85','stroke-width':1});el('text',{x:L-12,y:y(v)+5,'text-anchor':'end','font-size':15,fill:'#555'},v)}
el('text',{x:24,y:(T+B)/2,'font-size':15,fill:'#444',transform:`rotate(-90 24 ${(T+B)/2})`,'text-anchor':'middle'},'Número de estudios');
const gap=(R-L)/years.length,bw=100;
years.forEach((yr,i)=>{const cx=L+gap*i+gap/2;let acc=0;
  series.forEach(s=>{const v=s.v[i];if(!v)return;const y0=y(acc),y1=y(acc+v);
    el('rect',{x:cx-bw/2,y:y1+1,width:bw,height:Math.max(0,y0-y1-2),fill:s.color,rx:3});
    if(v>=5)el('text',{x:cx,y:(y0+y1)/2+5,'text-anchor':'middle','font-size':14,'font-weight':'bold',fill:'#fff'},v);
    acc+=v;});
  el('text',{x:cx,y:y(acc)-10,'text-anchor':'middle','font-size':16,'font-weight':'bold'},'n = '+acc);
  el('text',{x:cx,y:B+26,'text-anchor':'middle','font-size':16},yr);});
let lx=L,ly=26;series.forEach(s=>{el('rect',{x:lx,y:ly-13,width:16,height:16,fill:s.color,rx:3});const t=el('text',{x:lx+22,y:ly,'font-size':15},s.name);lx+=t.getComputedTextLength()+46;});
</script></body></html>
